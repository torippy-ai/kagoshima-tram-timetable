name: Update tram timetable data

# 毎日深夜（日本時間 4:00 = UTC 19:00）に公式サイトから時刻表データを取得し、
# 差分があればリポジトリにコミットする。手動実行（workflow_dispatch）も可能。
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write # このワークフローから「Deploy to GitHub Pages」を起動するために必要

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run scrape

      - name: Commit updated data if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/lines.json src/data/timetable/
          if git diff --cached --quiet; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update tram timetable data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # GitHub Actions の仕様上、ワークフロー自身が push しても
      # 別のワークフロー（Deploy to GitHub Pages）の on: push は自動発火しないため、
      # データに変更があった場合はここから明示的に Deploy を起動する。
      - name: Trigger deploy workflow
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
