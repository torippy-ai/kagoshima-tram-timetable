name: Update tram timetable data

# 毎日深夜（日本時間 4:00 = UTC 19:00）に公式サイトから時刻表データを取得し、
# 差分があればリポジトリにコミットする。手動実行（workflow_dispatch）も可能。
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run scrape

      - name: Commit updated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/lines.json src/data/timetable/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: update tram timetable data"
            git push
          fi
